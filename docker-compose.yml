services:
  traefik:
    image: traefik:v3.7.18
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=pdf_net
      - --entrypoints.web.address=:80
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - pdf_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-extractor-python:latest
    expose:
      - "8000"
    environment:
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
      WORKER_POOL_SIZE: "4"
      MAX_QUEUE_SIZE: "100"
      MAX_UPLOAD_BYTES: "15728640"
    labels:
      - traefik.enable=true
      - traefik.docker.network=pdf_net
      - 'traefik.http.routers.pdf.rule=PathPrefix(`/`)'
      - traefik.http.routers.pdf.entrypoints=web
      - traefik.http.services.pdf.loadbalancer.server.port=8000
      - traefik.http.services.pdf.loadbalancer.healthcheck.path=/health
      - traefik.http.services.pdf.loadbalancer.healthcheck.interval=10s
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - pdf_net

networks:
  pdf_net:
    driver: bridge
