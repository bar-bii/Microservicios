version: '3.8'

services:
  # Microservicio en Python / FastAPI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-extractor-python:latest
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
      - WORKER_POOL_SIZE=4
      - MAX_QUEUE_SIZE=100

networks:
  pdf_net:
    driver: bridge