[project]
name = "pdf-extractor"
version = "0.1.0"
description = "High-performance PDF-to-Markdown text extraction microservice"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["application", "presentation"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"
